<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="reg-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1816"/>
      <stop offset="50%" stop-color="#141211"/>
      <stop offset="100%" stop-color="#0E0D0C"/>
    </linearGradient>
    <pattern id="reg-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(216,211,200,0.06)" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#reg-sky)"/>
  <rect width="800" height="450" fill="url(#reg-grid)"/>

  <line x1="50" y1="50" x2="750" y2="50" stroke="rgba(216,211,200,0.15)" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="50" y1="400" x2="750" y2="400" stroke="rgba(216,211,200,0.2)" stroke-width="1"/>

  <!-- Commercial Arcade Facade -->
  <rect x="110" y="140" width="580" height="260" fill="#1B1917" stroke="rgba(216,211,200,0.2)" stroke-width="1.2"/>

  <!-- Storefront Units Row (Arcade Structure) -->
  <g stroke="rgba(216,211,200,0.25)" stroke-width="1" fill="#141311">
    <!-- Unit 1 -->
    <rect x="140" y="240" width="100" height="140"/>
    <rect x="150" y="260" width="80" height="80" fill="none" stroke="rgba(216,211,200,0.15)"/>
    <line x1="140" y1="230" x2="240" y2="230" stroke="#FF4F17" stroke-width="2"/>

    <!-- Unit 2 -->
    <rect x="270" y="240" width="100" height="140"/>
    <rect x="280" y="260" width="80" height="80" fill="none" stroke="rgba(216,211,200,0.15)"/>
    <line x1="270" y1="230" x2="370" y2="230" stroke="#D97706" stroke-width="2"/>

    <!-- Unit 3 -->
    <rect x="430" y="240" width="100" height="140"/>
    <rect x="440" y="260" width="80" height="80" fill="none" stroke="rgba(216,211,200,0.15)"/>
    <line x1="430" y1="230" x2="530" y2="230" stroke="#0D6847" stroke-width="2"/>

    <!-- Unit 4 -->
    <rect x="560" y="240" width="100" height="140"/>
    <rect x="570" y="260" width="80" height="80" fill="none" stroke="rgba(216,211,200,0.15)"/>
    <line x1="560" y1="230" x2="660" y2="230" stroke="#FF4F17" stroke-width="2"/>
  </g>

  <!-- Upper Story Offices & Signage Band -->
  <rect x="110" y="160" width="580" height="50" fill="#221F1C" stroke="rgba(216,211,200,0.2)" stroke-width="1"/>
  <text x="400" y="192" fill="#F4F2EE" font-family="'Instrument Serif', serif, Georgia" font-size="18" text-anchor="middle" letter-spacing="3">TOWN COMMERCIAL ARCADE</text>

  <!-- Metadata -->
  <g font-family="monospace" font-size="9" fill="rgba(244,242,238,0.7)" letter-spacing="1.5">
    <text x="60" y="75">COMMERCE 10 // MAIN BAZAAR COMMERCIAL COMPLEX</text>
    <text x="60" y="95" font-size="8" fill="#8B877F">STATION ROAD · RETAIL OUTLETS · WHOLESALE DISTRIBUTORS</text>
    <text x="740" y="75" text-anchor="end" fill="#0D6847" font-weight="700">VERIFIED MERCHANTS</text>
    <text x="740" y="95" text-anchor="end" font-size="8" fill="#8B877F">CLAIMABLE PROFILES</text>
  </g>
</svg>
