<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pes-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A18"/>
      <stop offset="50%" stop-color="#141413"/>
      <stop offset="100%" stop-color="#0E0E0D"/>
    </linearGradient>
    <linearGradient id="pes-facade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242422"/>
      <stop offset="100%" stop-color="#161615"/>
    </linearGradient>
    <pattern id="pes-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(216,211,200,0.06)" stroke-width="0.8"/>
    </pattern>
    <pattern id="pes-dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="0.8" fill="rgba(255,79,23,0.18)"/>
    </pattern>
  </defs>

  <!-- Canvas Base -->
  <rect width="800" height="450" fill="url(#pes-sky)"/>
  <rect width="800" height="450" fill="url(#pes-grid)"/>

  <!-- Technical Axis Markers -->
  <line x1="40" y1="40" x2="760" y2="40" stroke="rgba(216,211,200,0.15)" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="40" y1="410" x2="760" y2="410" stroke="rgba(216,211,200,0.2)" stroke-width="1"/>
  <line x1="40" y1="40" x2="40" y2="410" stroke="rgba(216,211,200,0.15)" stroke-width="1"/>
  <line x1="760" y1="40" x2="760" y2="410" stroke="rgba(216,211,200,0.15)" stroke-width="1"/>

  <!-- Architectural Background Block -->
  <rect x="80" y="140" width="640" height="270" fill="url(#pes-facade)" stroke="rgba(216,211,200,0.12)" stroke-width="1"/>

  <!-- Center Atrium Glass Tower -->
  <rect x="340" y="90" width="120" height="320" fill="#1C1C1A" stroke="#FF4F17" stroke-width="1.5"/>
  <rect x="340" y="90" width="120" height="320" fill="url(#pes-dots)"/>
  
  <!-- Modernist Horizontal Brise-Soleil (Window Ribbons) -->
  <g stroke="rgba(216,211,200,0.25)" stroke-width="1">
    <!-- Left Wing Levels -->
    <line x1="100" y1="180" x2="320" y2="180"/>
    <line x1="100" y1="230" x2="320" y2="230"/>
    <line x1="100" y1="280" x2="320" y2="280"/>
    <line x1="100" y1="330" x2="320" y2="330"/>
    <line x1="100" y1="380" x2="320" y2="380"/>

    <!-- Right Wing Levels -->
    <line x1="480" y1="180" x2="700" y2="180"/>
    <line x1="480" y1="230" x2="700" y2="230"/>
    <line x1="480" y1="280" x2="700" y2="280"/>
    <line x1="480" y1="330" x2="700" y2="330"/>
    <line x1="480" y1="380" x2="700" y2="380"/>
  </g>

  <!-- Vertical Mullions Grid -->
  <g stroke="rgba(216,211,200,0.08)" stroke-width="1">
    <line x1="150" y1="140" x2="150" y2="410"/>
    <line x1="200" y1="140" x2="200" y2="410"/>
    <line x1="250" y1="140" x2="250" y2="410"/>
    <line x1="300" y1="140" x2="300" y2="410"/>

    <line x1="500" y1="140" x2="500" y2="410"/>
    <line x1="550" y1="140" x2="550" y2="410"/>
    <line x1="600" y1="140" x2="600" y2="410"/>
    <line x1="650" y1="140" x2="650" y2="410"/>
  </g>

  <!-- Engineering Laboratory Crown & Portal -->
  <rect x="360" y="110" width="80" height="20" fill="none" stroke="#FF4F17" stroke-width="1"/>
  <text x="400" y="124" fill="#FF4F17" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="2">LAB BLOCK</text>

  <!-- Main Entrance Cantilever Canopy -->
  <polygon points="320,380 480,380 500,410 300,410" fill="#242422" stroke="rgba(216,211,200,0.3)" stroke-width="1"/>
  <line x1="330" y1="395" x2="470" y2="395" stroke="#FF4F17" stroke-width="2"/>

  <!-- Technical Monospace Labels & Architectural Metadata -->
  <g font-family="monospace" font-size="10" fill="rgba(244,242,238,0.7)" letter-spacing="1.5">
    <text x="60" y="70">FACILITY 01 // PES INSTITUTE OF MEDICAL &amp; ENG SCIENCES</text>
    <text x="60" y="90" font-size="8" fill="#8B877F">KUPPAM CAMPUS · 12°44'51" N  78°21'43" E · AP-EAPCET CODE: PESK</text>
    <text x="740" y="70" text-anchor="end" fill="#0D6847" font-weight="700">NBA ACCREDITED</text>
    <text x="740" y="90" text-anchor="end" font-size="8" fill="#8B877F">ELEVATION 670M</text>
  </g>

  <!-- Subtle Scale Ruler -->
  <g stroke="rgba(216,211,200,0.4)" stroke-width="1">
    <line x1="60" y1="425" x2="160" y2="425"/>
    <line x1="60" y1="420" x2="60" y2="425"/>
    <line x1="110" y1="422" x2="110" y2="425"/>
    <line x1="160" y1="420" x2="160" y2="425"/>
    <text x="110" y="437" font-family="monospace" font-size="7" fill="#8B877F" text-anchor="middle">50 METERS</text>
  </g>
</svg>
