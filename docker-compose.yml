version: "3.9"

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: otc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prajith
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: onetowncity
    ports:
      - "5433:5432"   # expose on 5433 to avoid conflict with local Postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prajith -d onetowncity"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PgBouncer (connection pooler) ──────────────────────────────────────────
  pgbouncer:
    image: bitnami/pgbouncer:latest
    container_name: otc_pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: prajith
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRESQL_DATABASE: onetowncity
      PGBOUNCER_DATABASE: onetowncity
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 200
      PGBOUNCER_DEFAULT_POOL_SIZE: 20
    ports:
      - "6432:6432"

volumes:
  postgres_data:
