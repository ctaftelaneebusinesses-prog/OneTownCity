services:
  # ── PostgreSQL 16 Local ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: otc_postgres_local
    restart: unless-stopped
    environment:
      POSTGRES_USER: otc_admin
      POSTGRES_PASSWORD: otc_local_password
      POSTGRES_DB: onetowncity_saas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otc_admin -d onetowncity_saas"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2048M

volumes:
  postgres_data:
