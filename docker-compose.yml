
services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: otc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prajith
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: onetowncity
    ports:
      - "5433:5432"   # expose on 5433 to avoid conflict with local Postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prajith -d onetowncity"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PgBouncer (connection pooler) ──────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: otc_pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://prajith:${POSTGRES_PASSWORD:-devpassword}@postgres/onetowncity
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
    ports:
      - "6432:5432"

volumes:
  postgres_data:

